<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 高保真微缩工作室房间</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Three.js r128 及 OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030305;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            user-select: none;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            display: block;
        }
        .glass-panel {
            background: rgba(18, 18, 26, 0.72);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
        }
        .btn-glow:hover {
            box-shadow: 0 0 16px rgba(255, 45, 117, 0.5);
        }
    </style>
</head>
<body>

    <!-- 3D 渲染画布容器 -->
    <div id="canvas-container"></div>

    <!-- 左上角标题卡片 -->
    <div class="fixed top-4 left-4 z-10 glass-panel rounded-2xl p-4 text-white max-w-xs transition-all duration-300 pointer-events-auto">
        <div class="flex items-center gap-2.5 mb-1">
            <span class="w-2.5 h-2.5 rounded-full bg-pink-500 animate-pulse"></span>
            <h1 class="text-sm font-bold tracking-wide text-gray-100">3D 微缩工作室还原</h1>
        </div>
        <p class="text-xs text-gray-400 leading-relaxed">
            高保真还原 Three.js 经典等距房间：包含双屏工作站、补光灯、电竞椅、电视背光、原声吉他及章鱼玩偶。
        </p>
    </div>

    <!-- 底部控制栏 -->
    <div class="fixed bottom-5 left-1/2 -translate-x-1/2 z-10 glass-panel rounded-2xl px-4 py-2.5 flex flex-wrap items-center justify-center gap-2 sm:gap-3 text-xs text-gray-200">
        <button id="btn-reset" class="px-3 py-1.5 rounded-xl bg-white/10 hover:bg-white/20 transition font-medium flex items-center gap-1.5 cursor-pointer">
            <span>🎥</span> 重置视角
        </button>
        <button id="btn-tv-light" class="px-3 py-1.5 rounded-xl bg-pink-600/80 hover:bg-pink-500 transition font-medium flex items-center gap-1.5 btn-glow cursor-pointer">
            <span>💖</span> 电视氛围灯
        </button>
        <button id="btn-key-light" class="px-3 py-1.5 rounded-xl bg-sky-600/80 hover:bg-sky-500 transition font-medium flex items-center gap-1.5 cursor-pointer">
            <span>💡</span> 桌面补光灯
        </button>
        <button id="btn-rotate" class="px-3 py-1.5 rounded-xl bg-white/10 hover:bg-white/20 transition font-medium flex items-center gap-1.5 cursor-pointer">
            <span>🔄</span> 自动旋转: 关
        </button>
    </div>

    <!-- 操作提示 -->
    <div class="fixed top-4 right-4 z-10 hidden sm:block glass-panel rounded-xl px-3.5 py-2 text-[11px] text-gray-400">
        左键拖拽旋转 · 滚轮缩放 · 右键平移
    </div>

    <script>
        // ================= 全局核心变量与房间尺寸常量 =================
        let scene, camera, renderer, controls;
        let tvBacklight, keySpotLight, deskOrangeLight;
        let tvScreenMat, monitorScreenMat;
        let octopusGroup, chairGroup;
        let tvLightOn = true, keyLightOn = true, autoRotate = false;
        const clock = new THREE.Clock();

        const ROOM_W = 5.2;
        const ROOM_D = 5.2;
        const WALL_H = 2.65;
        const WALL_T = 0.14;

        /**
         * 初始化 Three.js 场景、正交/透视相机、渲染器、三点照明与所有家具模块
         */
        function init() {
            const container = document.getElementById('canvas-container');

            // 1. 创建场景
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x030305);

            // 2. 创建相机（还原等距视角透视感）
            camera = new THREE.PerspectiveCamera(28, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(8.6, 6.8, 9.2);

            // 3. 创建抗锯齿高质量渲染器
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.outputEncoding = THREE.sRGBEncoding;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.08;
            container.appendChild(renderer.domElement);

            // 4. 轨道控制器
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.target.set(0.1, 1.15, 0.1);
            controls.enableDamping = true;
            controls.dampingFactor = 0.06;
            controls.minDistance = 4.5;
            controls.maxDistance = 22;
            controls.maxPolarAngle = Math.PI / 2 - 0.04;
            controls.update();

            // 5. 氛围照明系统
            setupLighting();

            // 6. 构建房间硬装与所有家具细节
            buildRoomShell();
            buildBookshelfAndElephants();
            buildDeskArea();
            buildGamingChair();
            buildGuitar();
            buildTVArea();
            buildSofaAndOctopus();
            buildCoffeeTable();
            buildPlants();

            // 7. 绑定交互事件与窗口自适应
            setupUIEvents();
            window.addEventListener('resize', onWindowResize);
        }

        /**
         * 配置全屋氛围光源（冷暖撞色補光 + 电视洋红背光 + 环境全局光）
         */
        function setupLighting() {
            // 基础微弱冷紫环境光，保持暗部层次
            const ambientLight = new THREE.AmbientLight(0x2a2538, 0.72);
            scene.add(ambientLight);

            // 顶部主方向光（投射柔和等距阴影）
            const dirLight = new THREE.DirectionalLight(0xeef2ff, 0.75);
            dirLight.position.set(5.5, 9.5, 6.5);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            dirLight.shadow.camera.near = 1;
            dirLight.shadow.camera.far = 25;
            const d = 4.5;
            dirLight.shadow.camera.left = -d;
            dirLight.shadow.camera.right = d;
            dirLight.shadow.camera.top = d;
            dirLight.shadow.camera.bottom = -d;
            dirLight.shadow.bias = -0.0005;
            scene.add(dirLight);

            // 左侧工作台冷白补光灯 (Key Light)
            keySpotLight = new THREE.SpotLight(0xdbeafe, 3.6, 8, Math.PI / 3.2, 0.65, 1.2);
            keySpotLight.position.set(-2.25, 1.72, -0.38);
            keySpotLight.target.position.set(-1.35, 0.65, -0.55);
            keySpotLight.castShadow = true;
            scene.add(keySpotLight);
            scene.add(keySpotLight.target);

            // 工作台后方暖橙色灯带溢光
            deskOrangeLight = new THREE.PointLight(0xff6b1a, 2.1, 4.2, 1.6);
            deskOrangeLight.position.set(-2.32, 0.92, -0.82);
            scene.add(deskOrangeLight);

            // 右侧电视后方高饱和洋红色氛围背光
            tvBacklight = new THREE.PointLight(0xff1468, 3.4, 5.5, 1.5);
            tvBacklight.position.set(1.22, 1.12, -ROOM_D / 2 + 0.24);
            scene.add(tvBacklight);
        }

        /**
         * 程序化生成拼接实木地板纹理
         */
        function createWoodFloorTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#9c623c';
            ctx.fillRect(0, 0, 512, 512);

            const plankCount = 8;
            const plankW = 512 / plankCount;
            const tones = ['#965b36', '#a46840', '#8d5330', '#ad7148'];

            for (let i = 0; i < plankCount; i++) {
                ctx.fillStyle = tones[i % tones.length];
                ctx.fillRect(i * plankW, 0, plankW - 2, 512);

                // 木纹细丝
                ctx.fillStyle = 'rgba(45, 22, 10, 0.12)';
                for (let g = 0; g < 14; g++) {
                    const gx = i * plankW + ((g * 19 + i * 7) % (plankW - 4));
                    ctx.fillRect(gx, 0, 1.5, 512);
                }

                // 横向错缝接缝
                const splitY = ((i * 173 + 90) % 420) + 40;
                ctx.fillStyle = 'rgba(35, 16, 8, 0.45)';
                ctx.fillRect(i * plankW, splitY, plankW, 2);
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.encoding = THREE.sRGBEncoding;
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(2, 2);
            return tex;
        }

        /**
         * 1 & 2. 构建房间木地板基座、两面垂直墙体、踢脚线以及带卷帘盒与栏杆的法式落地窗
         */
        function buildRoomShell() {
            const roomGroup = new THREE.Group();

            // 地板基座（带厚度）
            const floorTex = createWoodFloorTexture();
            const floorMat = new THREE.MeshStandardMaterial({
                map: floorTex,
                roughness: 0.56,
                metalness: 0.05
            });
            const baseMat = new THREE.MeshStandardMaterial({ color: 0x3b261a, roughness: 0.7 });

            const floorMesh = new THREE.Mesh(
                new THREE.BoxGeometry(ROOM_W + WALL_T, 0.16, ROOM_D + WALL_T),
                [baseMat, baseMat, floorMat, baseMat, baseMat, baseMat]
            );
            floorMesh.position.set(-WALL_T / 2, -0.08, -WALL_T / 2);
            floorMesh.receiveShadow = true;
            roomGroup.add(floorMesh);

            // 墙体材质（受灯光染色展现冷蓝紫与洋红渐变）
            const wallMat = new THREE.MeshStandardMaterial({
                color: 0xd8dce6,
                roughness: 0.78
            });
            const outerEdgeMat = new THREE.MeshStandardMaterial({ color: 0x2a2d3d, roughness: 0.6 });

            // 左侧后墙 (沿 Z 轴)
            const leftWall = new THREE.Mesh(
                new THREE.BoxGeometry(WALL_T, WALL_H, ROOM_D + WALL_T),
                [wallMat, outerEdgeMat, outerEdgeMat, outerEdgeMat, outerEdgeMat, outerEdgeMat]
            );
            leftWall.position.set(-ROOM_W / 2 - WALL_T / 2, WALL_H / 2, -WALL_T / 2);
            leftWall.castShadow = true;
            leftWall.receiveShadow = true;
            roomGroup.add(leftWall);

            // 右侧后墙 (沿 X 轴)
            const backWall = new THREE.Mesh(
                new THREE.BoxGeometry(ROOM_W, WALL_H, WALL_T),
                [outerEdgeMat, outerEdgeMat, outerEdgeMat, outerEdgeMat, wallMat, outerEdgeMat]
            );
            backWall.position.set(0, WALL_H / 2, -ROOM_D / 2 - WALL_T / 2);
            backWall.castShadow = true;
            backWall.receiveShadow = true;
            roomGroup.add(backWall);

            // 白色踢脚线
            const trimMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, roughness: 0.45 });
            const skirtL = new THREE.Mesh(new THREE.BoxGeometry(0.025, 0.09, ROOM_D), trimMat);
            skirtL.position.set(-ROOM_W / 2 + 0.012, 0.045, 0);
            roomGroup.add(skirtL);

            const skirtR = new THREE.Mesh(new THREE.BoxGeometry(ROOM_W, 0.09, 0.025), trimMat);
            skirtR.position.set(0, 0.045, -ROOM_D / 2 + 0.012);
            roomGroup.add(skirtR);

            // 右墙左侧的白色欧式窗户 + 顶部卷帘盒 + 底部防盗横杆
            const winGroup = new THREE.Group();
            winGroup.position.set(-0.62, 1.32, -ROOM_D / 2 + 0.02);

            const winW = 0.86, winH = 1.62;
            // 深黑窗外夜空背板
            const nightPane = new THREE.Mesh(
                new THREE.PlaneGeometry(winW - 0.08, winH - 0.08),
                new THREE.MeshBasicMaterial({ color: 0x040508 })
            );
            nightPane.position.z = -0.01;
            winGroup.add(nightPane);

            // 白色窗框四边
            const frameT = 0.065, frameD = 0.06;
            const topBar = new THREE.Mesh(new THREE.BoxGeometry(winW, frameT, frameD), trimMat);
            topBar.position.y = winH / 2 - frameT / 2;
            winGroup.add(topBar);

            const botBar = new THREE.Mesh(new THREE.BoxGeometry(winW + 0.04, frameT, frameD + 0.02), trimMat);
            botBar.position.y = -winH / 2 + frameT / 2;
            winGroup.add(botBar);

            [-winW / 2 + frameT / 2, winW / 2 - frameT / 2].forEach(wx => {
                const sideBar = new THREE.Mesh(new THREE.BoxGeometry(frameT, winH, frameD), trimMat);
                sideBar.position.x = wx;
                winGroup.add(sideBar);
            });

            // 顶部突出卷帘盒与拉手
            const shutterBox = new THREE.Mesh(new THREE.BoxGeometry(winW + 0.08, 0.24, 0.12), trimMat);
            shutterBox.position.set(0, winH / 2 + 0.13, 0.03);
            shutterBox.castShadow = true;
            winGroup.add(shutterBox);

            const shutterHandle = new THREE.Mesh(
                new THREE.BoxGeometry(0.16, 0.018, 0.02),
                new THREE.MeshStandardMaterial({ color: 0x94a3b8 })
            );
            shutterHandle.position.set(0, winH / 2 + 0.11, 0.095);
            winGroup.add(shutterHandle);

            // 窗户下半部分三根白色安全护栏横杆
            for (let b = 0; b < 3; b++) {
                const rail = new THREE.Mesh(new THREE.BoxGeometry(winW - 0.08, 0.022, 0.022), trimMat);
                rail.position.set(0, -winH / 2 + 0.18 + b * 0.14, 0.015);
                winGroup.add(rail);
            }

            roomGroup.add(winGroup);
            scene.add(roomGroup);
        }

        /**
         * 程序化生成电视屏幕纹理 ("three.js journey" 标志、几何线条与细腻抗锯齿反光)
         */
        function createTVScreenTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 576;
            const ctx = canvas.getContext('2d');

            // 深炭灰微渐变背景（还原原图略带暖紫暗调的屏幕反光）
            const grad = ctx.createLinearGradient(0, 0, 1024, 576);
            grad.addColorStop(0, '#211f26');
            grad.addColorStop(0.55, '#292730');
            grad.addColorStop(1, '#1c1a22');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 1024, 576);

            // 绘制左侧 Three.js Journey 标志性立体等距三角形/多面体 Logo
            const cx = 338, cy = 264, r = 24;
            ctx.save();
            ctx.translate(cx, cy);
            ctx.strokeStyle = '#9f85ff';
            ctx.lineWidth = 3.2;
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';

            // 外三角形轮廓
            ctx.beginPath();
            for (let i = 0; i < 3; i++) {
                const angle = (Math.PI * 2 / 3) * i - Math.PI / 2;
                const px = Math.cos(angle) * r;
                const py = Math.sin(angle) * r;
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.stroke();

            // 内部细分小三角形网络（还原 Three.js 经典 Logo 拓扑）
            const midPoints = [];
            for (let i = 0; i < 3; i++) {
                const a1 = (Math.PI * 2 / 3) * i - Math.PI / 2;
                const a2 = (Math.PI * 2 / 3) * ((i + 1) % 3) - Math.PI / 2;
                midPoints.push({
                    x: (Math.cos(a1) * r + Math.cos(a2) * r) / 2,
                    y: (Math.sin(a1) * r + Math.sin(a2) * r) / 2
                });
            }
            ctx.beginPath();
            ctx.moveTo(midPoints[0].x, midPoints[0].y);
            ctx.lineTo(midPoints[1].x, midPoints[1].y);
            ctx.lineTo(midPoints[2].x, midPoints[2].y);
            ctx.closePath();
            ctx.stroke();
            ctx.restore();

            // 绘制文字 "three.js journey"
            ctx.fillStyle = '#f8fafc';
            ctx.font = '700 35px Inter, Arial, sans-serif';
            ctx.fillText('three.js', 378, 275);

            ctx.fillStyle = '#cbd5e1';
            ctx.font = '400 34px Inter, Arial, sans-serif';
            ctx.fillText('journey', 514, 275);

            const tex = new THREE.CanvasTexture(canvas);
            tex.encoding = THREE.sRGBEncoding;
            tex.anisotropy = 8;
            return tex;
        }

        /**
         * 程序化生成主显示器屏幕纹理（Mac 暖橙色渐变壁纸 + 底部悬浮 Dock 栏 + 桌面小雕塑）
         */
        function createMainMonitorTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 320;
            const ctx = canvas.getContext('2d');

            // 暖橙金渐变背景
            const grad = ctx.createLinearGradient(0, 0, 512, 320);
            grad.addColorStop(0, '#ff9838');
            grad.addColorStop(0.5, '#ff7722');
            grad.addColorStop(1, '#e84c18');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 512, 320);

            // 顶部极细状态栏
            ctx.fillStyle = 'rgba(0, 0, 0, 0.22)';
            ctx.fillRect(0, 0, 512, 10);

            // 屏幕中央偏左下小黄鸭/几何吉祥物剪影（还原原图细节）
            ctx.fillStyle = '#facc15';
            ctx.beginPath();
            ctx.ellipse(242, 205, 13, 10, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(248, 193, 7.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#f97316';
            ctx.fillRect(254, 191, 6, 4);

            // 底部透明磨砂 Dock 栏与彩色应用图标
            ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
            ctx.beginPath();
            ctx.roundRect(130, 294, 252, 18, 6);
            ctx.fill();

            const iconColors = ['#3b82f6', '#22c55e', '#f59e0b', '#ef4444', '#a855f7', '#06b6d4', '#ec4899', '#f97316', '#64748b'];
            iconColors.forEach((col, idx) => {
                ctx.fillStyle = col;
                ctx.beginPath();
                ctx.roundRect(140 + idx * 26, 297, 16, 12, 3);
                ctx.fill();
            });

            const tex = new THREE.CanvasTexture(canvas);
            tex.encoding = THREE.sRGBEncoding;
            return tex;
        }

        /**
         * 程序化生成笔记本屏幕纹理（高还原 Blender 3D 建模暗色界面 + 橙色高亮节点）
         */
        function createLaptopTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 320;
            const ctx = canvas.getContext('2d');

            // Blender 经典深灰主视口
            ctx.fillStyle = '#33363f';
            ctx.fillRect(0, 0, 512, 320);

            // 顶部菜单栏、右侧大纲/属性面板、底部时间轴
            ctx.fillStyle = '#1f2127';
            ctx.fillRect(0, 0, 512, 20);
            ctx.fillRect(365, 20, 147, 300);
            ctx.fillStyle = '#25272e';
            ctx.fillRect(0, 242, 365, 78);

            // 视口透视参考网格
            ctx.strokeStyle = 'rgba(255,255,255,0.09)';
            ctx.lineWidth = 1;
            for (let x = 24; x < 350; x += 22) {
                ctx.beginPath(); ctx.moveTo(x, 28); ctx.lineTo(x, 232); ctx.stroke();
            }
            for (let y = 28; y < 232; y += 22) {
                ctx.beginPath(); ctx.moveTo(24, y); ctx.lineTo(350, y); ctx.stroke();
            }

            // 视口中央 3D 房间灰度白模预览 + 橙色选中轮廓线
            ctx.fillStyle = '#6b7280';
            ctx.fillRect(145, 95, 85, 65);
            ctx.strokeStyle = '#ff8c24';
            ctx.lineWidth = 2;
            ctx.strokeRect(145, 95, 85, 65);

            // 右侧属性栏彩色标签与滑块
            ctx.fillStyle = '#ff8c24';
            ctx.fillRect(380, 48, 112, 12);
            ctx.fillStyle = '#3b82f6';
            ctx.fillRect(380, 72, 95, 10);
            ctx.fillStyle = '#4b5563';
            for (let r = 0; r < 6; r++) {
                ctx.fillRect(380, 96 + r * 22, 115, 10);
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.encoding = THREE.sRGBEncoding;
            return tex;
        }

        /**
         * 程序化生成电竞椅缝线与碳纤维纹理
         */
        function createChairSeatTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#1b1c22';
            ctx.fillRect(0, 0, 256, 256);

            // 白色精细车缝线框
            ctx.strokeStyle = 'rgba(235, 240, 248, 0.78)';
            ctx.lineWidth = 4;
            ctx.setLineDash([7, 4]);
            ctx.strokeRect(14, 14, 228, 228);

            // 中央菱形格纹
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
            ctx.lineWidth = 1.5;
            ctx.setLineDash([]);
            for (let i = -256; i < 512; i += 28) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i + 256, 256); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(i + 256, 0); ctx.lineTo(i, 256); ctx.stroke();
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.encoding = THREE.sRGBEncoding;
            return tex;
        }

        /**
         * 3. 构建左侧书架及顶部的彩色小象手办阵列（带圆润雕塑感小象、柜门暗把手、书脊细节）
         */
        function buildBookshelfAndElephants() {
            const shelfGroup = new THREE.Group();
            shelfGroup.position.set(-ROOM_W / 2 + 0.28, 0, 1.35);

                el.scale.setScalar(scale);

        /**

         */
        function buildSofaAndOctopus() {
            const sofaGroup = new THREE.Group();
            sofaGroup.position.set(0.32, 0, 1.38);

            const sofaMat = new THREE.MeshStandardMaterial({ color: 0x2c2a37, roughness: 0.82 });

            const sw = 2.05, sd = 0.86;

            base.position.set(0, 0.16, 0);
            base.castShadow = true;
            base.receiveShadow = true;
            sofaGroup.add(base);

            // 沙发矮脚
            const legMat = new THREE.MeshStandardMaterial({ color: 0x18181b });
            [[-sw / 2 + 0.1, sd / 2 - 0.1], [sw / 2 - 0.1, sd / 2 - 0.1],
             [-sw / 2 + 0.1, -sd / 2 + 0.1], [sw / 2 - 0.1, -sd / 2 + 0.1]].forEach(([lx, lz]) => {
                const foot = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.02, 0.05, 10), legMat);
                foot.position.set(lx, 0.025, lz);
                sofaGroup.add(foot);
            });

            // 两个厚实座垫
            [-0.46, 0.46].forEach(cx => {
                const seatCushion = new THREE.Mesh(new THREE.BoxGeometry(0.88, 0.13, 0.66), cushionMat);
                seatCushion.position.set(cx, 0.33, -0.06);
                seatCushion.castShadow = true;
                sofaGroup.add(seatCushion);
            });

            // 后背靠板（靠近镜头前景侧）
            const backrest = new THREE.Mesh(new THREE.BoxGeometry(sw, 0.48, 0.18), sofaMat);
            backrest.position.set(0, 0.50, sd / 2 - 0.09);
            backrest.castShadow = true;
            sofaGroup.add(backrest);

            // 左右扶手
            [-sw / 2 + 0.09, sw / 2 - 0.09].forEach(ax => {
                const arm = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.42, sd), sofaMat);
                arm.position.set(ax, 0.45, 0);
                arm.castShadow = true;
                sofaGroup.add(arm);
            });

            // 沙发左侧抱枕
            const throwPillow = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.25, 0.11), cushionMat);
            throwPillow.position.set(-0.74, 0.48, 0.15);
            throwPillow.rotation.set(-0.2, 0.45, 0.15);
            sofaGroup.add(throwPillow);

            // 标志性淡紫灰色章鱼毛绒玩偶（趴在沙发右后角，还原圆鼓鼓头部与自然垂落的8条触手）
            octopusGroup = new THREE.Group();
            octopusGroup.position.set(0.68, 0.72, sd / 2 - 0.04);

            const octoMat = new THREE.MeshStandardMaterial({
                color: 0x9c95aa,
                roughness: 0.70,
                metalness: 0.02
            });

            // 圆润饱满的章鱼头部
            const headGeo = new THREE.SphereGeometry(0.215, 32, 28);
            headGeo.scale(0.95, 1.18, 0.95);
            const head = new THREE.Mesh(headGeo, octoMat);
            head.position.y = 0.14;
            head.castShadow = true;
            octopusGroup.add(head);

            // 黑色圆润小眼睛（朝向茶几侧）
            const eyeMat = new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.18 });
            [-0.08, 0.08].forEach(ex => {
                const eye = new THREE.Mesh(new THREE.SphereGeometry(0.019, 14, 14), eyeMat);
                eye.position.set(ex, 0.11, -0.188);
                octopusGroup.add(eye);
            });

            // 生成弯曲下垂并带尖端收窄效果的章鱼触手
            function addTentacle(pointsArr, baseRadius = 0.033) {
                const curve = new THREE.CatmullRomCurve3(pointsArr.map(p => new THREE.Vector3(p[0], p[1], p[2])));
                const tubeGeo = new THREE.TubeGeometry(curve, 24, baseRadius, 14, false);
                const tube = new THREE.Mesh(tubeGeo, octoMat);
                tube.castShadow = true;
                octopusGroup.add(tube);

                // 触手末端圆头
                const endPt = pointsArr[pointsArr.length - 1];
                const tip = new THREE.Mesh(new THREE.SphereGeometry(baseRadius * 0.92, 12, 12), octoMat);
                tip.position.set(endPt[0], endPt[1], endPt[2]);
                octopusGroup.add(tip);
            }

            // 后侧垂落的四条长触手（垂向地面）
            addTentacle([[-0.11, 0.02, 0.08], [-0.15, -0.25, 0.14], [-0.16, -0.63, 0.13]], 0.031);
            addTentacle([[-0.04, 0.02, 0.12], [-0.05, -0.28, 0.16], [-0.05, -0.69, 0.15]], 0.033);
            addTentacle([[ 0.05, 0.02, 0.12], [ 0.06, -0.28, 0.16], [ 0.07, -0.69, 0.15]], 0.033);
            addTentacle([[ 0.12, 0.02, 0.08], [ 0.16, -0.25, 0.14], [ 0.17, -0.63, 0.13]], 0.031);

            // 左侧展开搭在沙发靠背上的大触手
            addTentacle([[-0.14, 0.04, 0.02], [-0.32, 0.06, 0.04], [-0.46, -0.05, 0.08]], 0.034);

            // 右侧伸向沙发内侧的触手
            addTentacle([[ 0.14, 0.04, -0.04], [ 0.28, 0.08, -0.14], [ 0.36, 0.02, -0.26]], 0.032);

            sofaGroup.add(octopusGroup);
            scene.add(sofaGroup);
        }

                const stick = new THREE.Mesh(new THREE.CylinderGeometry(0.011, 0.011, 0.012, 12), darkMat);
                stick.position.set(sx, 0.016, 0.006);
                ctrlGroup.add(stick);
            });
            tableGroup.add(ctrlGroup);

            // 茶几远端的圆形织物智能音箱 (Google Home Mini 造型)
            const speaker = new THREE.Mesh(
                new THREE.SphereGeometry(0.062, 24, 16),
                new THREE.MeshStandardMaterial({ color: 0x6b7280, roughness: 0.75 })
            );
            speaker.scale.set(1.0, 0.42, 1.0);
            speaker.position.set(-0.08, th + 0.026, -0.18);
            speaker.castShadow = true;
            tableGroup.add(speaker);

            scene.add(tableGroup);
        }

        /**
         * 10. 构建两株室内绿植（工作台角落大型龟背竹 + 电视柜右侧小盆栽）
         */
        function buildPlants() {
            const potMat = new THREE.MeshStandardMaterial({ color: 0x1e2028, roughness: 0.5 });
            const leafMat = new THREE.MeshStandardMaterial({
                color: 0x3a6b35,
                roughness: 0.55,
                side: THREE.DoubleSide
            });

            // A. 工作台后方大型龟背竹
            const bigPlant = new THREE.Group();
            bigPlant.position.set(-1.72, 0.78, -2.05);

            const bigPot = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.12, 0.28, 20), potMat);
            bigPot.position.y = 0.14;
            bigPot.castShadow = true;
            bigPlant.add(bigPot);

            for (let i = 0; i < 11; i++) {
                const angle = (Math.PI * 2 / 11) * i + 0.3;
                const height = 0.42 + (i % 3) * 0.14;
                const tilt = 0.45 + (i % 3) * 0.18;

                const leafPivot = new THREE.Group();
                leafPivot.position.y = 0.24;
                leafPivot.rotation.y = angle;

                const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.006, 0.009, height), leafMat);
                stem.position.y = height / 2;
                stem.rotation.z = tilt;
                leafPivot.add(stem);

                const bladeGeo = new THREE.CircleGeometry(0.16, 12);
                bladeGeo.scale(0.85, 1.25, 1);
                const blade = new THREE.Mesh(bladeGeo, leafMat);
                blade.position.set(-Math.sin(tilt) * height, Math.cos(tilt) * height + 0.03, 0);
                blade.rotation.set(0.4, 0, tilt + 0.6);
                blade.castShadow = true;
                leafPivot.add(blade);

                bigPlant.add(leafPivot);
            }
            scene.add(bigPlant);

            // B. 电视柜右侧桌面小绿植
            const smallPlant = new THREE.Group();
            smallPlant.position.set(2.12, 0.44, -ROOM_D / 2 + 0.42);

            const smallPot = new THREE.Mesh(new THREE.CylinderGeometry(0.095, 0.075, 0.14, 18), potMat);
            smallPot.position.y = 0.07;
            smallPot.castShadow = true;
            smallPlant.add(smallPot);

            for (let i = 0; i < 9; i++) {
                const angle = (Math.PI * 2 / 9) * i;
                const leafPivot = new THREE.Group();
                leafPivot.position.y = 0.13;
                leafPivot.rotation.y = angle;

                const leaf = new THREE.Mesh(new THREE.BoxGeometry(0.055, 0.006, 0.18), leafMat);
                leaf.position.set(0, 0.06, 0.08);
                leaf.rotation.x = -0.45;
                leaf.castShadow = true;
                leafPivot.add(leaf);

                smallPlant.add(leafPivot);
            }
            scene.add(smallPlant);
        }

        /**
         * 绑定底部交互控制按钮事件
         */
        function setupUIEvents() {
            document.getElementById('btn-reset').addEventListener('click', () => {
                camera.position.set(8.6, 6.8, 9.2);
                controls.target.set(0.1, 1.15, 0.1);
                controls.update();
            });

            document.getElementById('btn-tv-light').addEventListener('click', (e) => {
                tvLightOn = !tvLightOn;
                tvBacklight.intensity = tvLightOn ? 3.4 : 0.2;
                tvScreenMat.emissiveIntensity = tvLightOn ? 0.42 : 0.08;
                e.currentTarget.style.opacity = tvLightOn ? '1' : '0.5';
            });

            document.getElementById('btn-key-light').addEventListener('click', (e) => {
                keyLightOn = !keyLightOn;
                keySpotLight.intensity = keyLightOn ? 3.6 : 0;
                deskOrangeLight.intensity = keyLightOn ? 2.1 : 0.3;
                e.currentTarget.style.opacity = keyLightOn ? '1' : '0.5';
            });

            document.getElementById('btn-rotate').addEventListener('click', (e) => {
                autoRotate = !autoRotate;
                controls.autoRotate = autoRotate;
                controls.autoRotateSpeed = 1.2;
                e.currentTarget.innerHTML = `<span>🔄</span> 自动旋转: ${autoRotate ? '开' : '关'}`;
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        /**
         * 主动画循环：包含微妙的呼吸光效与章鱼/椅子微动
         */
        function animate() {
            requestAnimationFrame(animate);

            const elapsed = clock.getElapsedTime();

            // 电视背光微妙呼吸质感
            if (tvLightOn && tvBacklight) {
                tvBacklight.intensity = 3.3 + Math.sin(elapsed * 1.8) * 0.25;
            }

            // 章鱼玩偶轻微呼吸起伏
            if (octopusGroup) {
                octopusGroup.position.y = 0.72 + Math.sin(elapsed * 2.2) * 0.006;
            }

            controls.update();
            renderer.render(scene, camera);
        }

        window.onload = function () {
            init();
            animate();
        };
    </script>
</body>
</html>
